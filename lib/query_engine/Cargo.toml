[package]
name = "query_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
serde = "1.0.229"
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tick_score = { path = "../tick_score" }
polars = { version = "0.55.2", features = ["lazy", "sql", "parquet", "dtype-full"] }
ingestion_engine = { path = "../ingestion_engine" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
ingestion_engine = { path = "../ingestion_engine" }
futures = "0.3.34"
